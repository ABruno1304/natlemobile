<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Natle by Initbe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .instructions {
      margin-bottom: 20px;
      font-size: 16px;
      line-height: 1.5;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .instructions ol {
      padding-left: 20px;
      text-align: left;
    }

    #lives {
      font-size: 28px;
      margin: 20px 0;
    }

    #word {
      font-size: 32px;
      letter-spacing: 12px;
      margin: 20px;
      word-break: break-word;
      text-transform: uppercase;
    }

    #keyboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
      gap: 5px;
      max-width: 400px;
      margin: 20px auto;
    }

    .key {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #ddd;
      cursor: pointer;
      transition: 0.2s;
    }

    .key.correct {
      background-color: green;
      color: white;
    }

    .key.wrong {
      background-color: red;
      color: white;
    }

    #message {
      font-size: 24px;
      margin: 20px;
      font-weight: bold;
    }

    #nextBtn {
      display: none;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .key {
        font-size: 14px;
        padding: 8px;
      }

      #word {
        font-size: 24px;
      }

      .instructions {
        text-align: left;
        padding: 0 10px;
      }
    }

    @media (min-width: 601px) {
      .key {
        font-size: 20px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>Natle by Initbe</h1>
  <div class="instructions">
    <p>Welcome to Natle! 🎯</p>
    <ol>
      <li>This game is about finding the hidden country.</li>
      <li>Click the correct letters to guess the country's name.</li>
      <li>Correct letters turn <strong>green</strong>, wrong ones turn <strong>red</strong>.</li>
      <li>You have 7 ❤️s. One heart disappears for each wrong guess.</li>
    </ol>
  </div>
  <div id="lives">❤️❤️❤️❤️❤️❤️❤️</div>
  <div id="word"></div>
  <div id="keyboard"></div>
  <div id="message"></div>
  <button id="nextBtn" onclick="startGame()">Next Game</button>

  <script>
    const countries = [
      "Afghanistan","Albania","Algeria","Andorra","Angola","Argentina","Armenia","Australia","Austria","Azerbaijan",
      "Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia",
      "Bosnia","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon",
      "Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia",
      "Cuba","Cyprus","Czech Republic","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador",
      "Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia",
      "Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti",
      "Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy",
      "Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia",
      "Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia",
      "Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco",
      "Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand",
      "Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine",
      "Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia",
      "Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent","Samoa","San Marino","Sao Tome","Saudi Arabia","Senegal","Serbia",
      "Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan",
      "Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania",
      "Thailand","Timor-Leste","Togo","Tonga","Trinidad","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda",
      "Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam",
      "Yemen","Zambia","Zimbabwe"
    ];

    let chosenCountry = "";
    let revealed = [];
    let lives = 7;

    function startGame() {
      document.getElementById("message").textContent = "";
      document.getElementById("nextBtn").style.display = "none";
      lives = 7;
      updateLives();

      const shuffled = countries.sort(() => 0.5 - Math.random());
      chosenCountry = shuffled[0].toUpperCase();
      revealed = Array.from(chosenCountry).map(char => (char === ' ' ? ' ' : '_'));
      renderWord();
      renderKeyboard();
    }

    function updateLives() {
      document.getElementById("lives").textContent = "❤️".repeat(lives);
    }

    function renderWord() {
      document.getElementById("word").textContent = revealed.join(" ");
    }

    function renderKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const button = document.createElement("button");
        button.textContent = letter;
