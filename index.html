<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Natle by Initbe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.2em;
    }

    .instructions {
      text-align: left;
      margin: 0 auto 20px auto;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .instructions {
        font-size: 14px;
        text-align: center;
      }
    }

    .hearts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      margin: 15px 0;
    }

    .heart {
      font-size: 2em;
      color: red;
    }

    .word-container {
      margin: 20px 0;
      font-size: 2em;
      letter-spacing: 10px;
      text-transform: uppercase;
    }

    .letter-button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      background-color: white;
      transition: 0.2s;
    }

    @media (max-width: 600px) {
      .letter-button {
        font-size: 14px;
        padding: 8px 12px;
      }
    }

    .letter-button.correct {
      background-color: #d4edda;
      color: green;
      border-color: green;
    }

    .letter-button.wrong {
      background-color: #f8d7da;
      color: red;
      border-color: red;
    }

    .end-message {
      font-size: 1.5em;
      margin: 20px 0;
    }

    .hidden {
      display: none;
    }

    .play-again {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Natle by Initbe</h1>
    <p>Welcome to Natle! 🎯</p>
    <div class="instructions">
      <ol>
        <li>This game is about finding the hidden country.</li>
        <li>Click the correct letters to guess the country's name.</li>
        <li>Correct letters turn <strong style="color:green;">green</strong>, wrong ones turn <strong style="color:red;">red</strong>.</li>
        <li>You have 7 <span class="heart">❤️</span>s. One heart disappears for each wrong guess.</li>
      </ol>
    </div>

    <div class="hearts" id="hearts"></div>

    <div class="word-container" id="wordContainer"></div>

    <div id="alphabetButtons"></div>

    <div class="end-message hidden" id="endMessage"></div>
    <button class="play-again hidden" id="playAgainBtn" onclick="startGame()">Play Again</button>
  </div>

  <script>
    const countries = [
      "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia",
      "Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium",
      "Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria",
      "Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic",
      "Chad","Chile","China","Colombia","Comoros","Congo (Congo-Brazzaville)","Costa Rica","Croatia",
      "Cuba","Cyprus","Czechia","Democratic Republic of the Congo","Denmark","Djibouti","Dominica",
      "Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia",
      "Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana",
      "Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary",
      "Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Ivory Coast","Jamaica",
      "Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon",
      "Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi",
      "Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico",
      "Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar",
      "Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria",
      "North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine State","Panama",
      "Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania",
      "Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines",
      "Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles",
      "Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa",
      "South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland",
      "Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago",
      "Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates",
      "United Kingdom","United States of America","Uruguay","Uzbekistan","Vanuatu","Vatican City",
      "Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"
    ];

    let selectedCountry = '';
    let displayedWord = [];
    let lives = 7;

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function startGame() {
      // Reset
      document.getElementById('endMessage').classList.add('hidden');
      document.getElementById('playAgainBtn').classList.add('hidden');
      lives = 7;

      // Pick random country
      shuffleArray(countries);
      selectedCountry = countries[0].toUpperCase();
      displayedWord = selectedCountry.split('').map(c => (c === ' ' ? ' ' : '_'));
      updateWordDisplay();
      updateHearts();
      createAlphabetButtons();
    }

    function updateWordDisplay() {
      document.getElementById('wordContainer').textContent = displayedWord.join(' ');
    }

    function updateHearts() {
      const heartContainer = document.getElementById('hearts');
      heartContainer.innerHTML = '';
      for (let i = 0; i < lives; i++) {
        const heart = document.createElement('span');
        heart.classList.add('heart');
        heart.textContent = '❤️';
        heartContainer.appendChild(heart);
      }
    }

    function createAlphabetButtons() {
      const container = document.getElementById('alphabetButtons');
      container.innerHTML = '';
      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement('button');
        btn.className = 'letter-button';
        btn.textContent = letter;
        btn.onclick = () => handleGuess(letter, btn);
        container.appendChild(btn);
      }
    }

    function handleGuess(letter, button) {
      button.disabled = true;
      if (selectedCountry.includes(letter)) {
        button.classList.add('correct');
        selectedCountry.split('').forEach((char, index) => {
          if (char === letter) displayedWord[index] = letter;
        });
        updateWordDisplay();
        if (!displayedWord.includes('_')) {
          endGame(true);
        }
      } else {
        button.classList.add('wrong');
        lives--;
        updateHearts();
        if (lives === 0) {
          endGame(false);
        }
      }
    }

    function endGame(won) {
      const msg = document.getElementById('endMessage');
      msg.classList.remove('hidden');
      msg.textContent = won ? `🎉 You win! The country was: ${selectedCountry}` : `😢 You lost! The country was: ${selectedCountry}`;
      document.getElementById('playAgainBtn').classList.remove('hidden');
    }

    startGame();
  </script>
</body>
</html>
